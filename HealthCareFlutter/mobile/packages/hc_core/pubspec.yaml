name: hc_core
description: Shared domain model, lifecycle, and services for the HomeCare Flutter apps (client, caregiver, admin).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (source of truth + auth + push) — same project as the PWA.
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # Real-time live tracking via the ASP.NET Core SignalR hub.
  signalr_netcore: ^1.4.0

  # Geolocation for caregiver location sharing.
  geolocator: ^13.0.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  test: ^1.25.0
