name: app_caregiver
description: HomeCare Caregiver app — receive requests, navigate to clients, share live location, complete services.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hc_core:
    path: ../packages/hc_core
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  # Turn-by-turn navigation (Google Navigation SDK for Flutter).
  google_navigation_flutter: ^0.5.0
  geolocator: ^13.0.1
  provider: ^6.1.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
